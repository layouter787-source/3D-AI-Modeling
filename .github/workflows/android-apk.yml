name: Build 3D AI Modeling APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mesh-tests:
    name: Native mesh regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile native mesh tests
        run: >-
          g++ -std=c++17 -O2 -Wall -Wextra
          -Iapp/src/main/cpp
          app/src/test/cpp/mesh_regression.cpp
          app/src/main/cpp/core/polymesh.cpp
          app/src/main/cpp/core/mesh.cpp
          -o mesh-regression
      - name: Run native mesh tests
        run: ./mesh-regression

  build:
    needs: native-mesh-tests
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Explicit package list prevents setup-android from trying to install
      # the obsolete Android SDK package named "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Generate Gradle wrapper if absent
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-AI-Modeling-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
